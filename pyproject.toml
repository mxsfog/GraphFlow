[project]
name = "electromotiv-practice-pipeline"
version = "0.1.0"
description = "Python news search, OpenRouter ranking, and OrientDB persistence pipeline for practice demo."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
electromotiv-news = "electromotiv_pipeline.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
