[project]
name = "electromotiv-practice-pipeline"
version = "0.1.0"
description = "GraphFlow document and news processing pipeline with OrientDB persistence."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.5",
]

[project.scripts]
graphflow = "electromotiv_pipeline.cli:main"
electromotiv-news = "electromotiv_pipeline.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
