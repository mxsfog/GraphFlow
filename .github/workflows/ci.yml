name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      orientdb:
        image: orientdb@sha256:a9fbd14f78440a4e24e52fd2f483aff34be45118a2d8e56157c779ebd4b13536
        env:
          ORIENTDB_ROOT_PASSWORD: ci-orientdb-password
        ports:
          - 2480:2480
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2480'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24
          --health-start-period 20s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv==0.10.11

      - name: Install Python project
        run: uv sync --frozen --group dev

      - name: Check Python
        run: |
          uv run --frozen ruff check src tests
          uv run --frozen python -m compileall -q src tests
          uv run --frozen python -m pytest -q

      - name: Test OrientDB integration
        env:
          ORIENTDB_INTEGRATION: "1"
          ORIENTDB_ROOT_PASSWORD: ci-orientdb-password
          ORIENTDB_DATABASE: news_ci
        run: uv run --frozen python -m pytest -q tests/test_orientdb_integration.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci --prefix frontend

      - name: Build frontend
        run: |
          npm run test --prefix frontend
          npm run build --prefix frontend
